
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiDAR Height Inspector</title>

  <script type="module" src="https://js.arcgis.com/5.1/"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    arcgis-scene {
      display: block;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: absolute;
      z-index: 10;
      background: white;
      color: #222;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 3px 14px #0003;
    }

    #result-panel {
      left: 16px;
      bottom: 20px;
      width: 270px;
      max-width: calc(100vw - 64px);
    }

    #controls-panel {
      top: 16px;
      right: 16px;
      width: 220px;
    }

    .heading {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #height {
      font-size: 32px;
      font-weight: bold;
      color: #087f8c;
      margin: 8px 0;
    }

    #details {
      font-size: 12px;
      line-height: 1.6;
      color: #555;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 11px;
      margin-top: 8px;
      border: none;
      border-radius: 6px;
      background: #087f8c;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #06636d;
    }

    button.secondary {
      background: #505d6b;
    }

    button.secondary:hover {
      background: #36414c;
    }

    .hint {
      color: #666;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
    }

    @media (max-width: 500px) {
      #controls-panel {
        top: 10px;
        right: 10px;
        width: 185px;
      }

      #result-panel {
        left: 10px;
        bottom: 10px;
        width: 210px;
      }
    }
  </style>
</head>

<body>

  <!-- Your existing ArcGIS Online scene -->
  <arcgis-scene
    id="scene"
    item-id="c71ad5b695274ab2b74b06e705f3ea57">
  </arcgis-scene>

  <!-- Camera controls -->
  <div class="panel" id="controls-panel">
    <div class="heading">3D Tools</div>

    <button id="eye-level-button">
      Set eye level (1.9 m)
    </button>

    <button id="clear-button" class="secondary">
      Clear selected point
    </button>

    <div class="hint">
      Click a LiDAR point to highlight it
      and calculate its height above ground.
    </div>
  </div>

  <!-- Measurement results -->
  <div class="panel" id="result-panel">
    <div class="heading">LiDAR Height Inspector</div>

    <div>Height above ground</div>

    <div id="height">Ready</div>

    <div id="details">
      Click a LiDAR point to begin.
    </div>
  </div>

  <script type="module">
    const scene = document.querySelector("#scene");
    const heightText = document.querySelector("#height");
    const details = document.querySelector("#details");

    const eyeButton = document.querySelector("#eye-level-button");
    const clearButton = document.querySelector("#clear-button");

    // Wait for the web scene to finish loading.
    await scene.viewOnReady();

    const view = scene.view;

    // Create a separate graphics layer for the selection marker.
    const [GraphicsLayer, Graphic] = await $arcgis.import([
      "@arcgis/core/layers/GraphicsLayer.js",
      "@arcgis/core/Graphic.js"
    ]);

    const selectionLayer = new GraphicsLayer({
      title: "Selected LiDAR Point",
      elevationInfo: {
        mode: "absolute-height"
      },
      listMode: "hide"
    });

    view.map.add(selectionLayer);

    // Draw a marker at the selected point.
    function highlightPoint(point) {
      selectionLayer.removeAll();

      const marker = new Graphic({
        geometry: point.clone(),
        symbol: {
          type: "simple-marker",
          style: "circle",
          color: [0, 255, 255, 1],
          size: 15,
          outline: {
            color: [255, 255, 255, 1],
            width: 2
          }
        }
      });

      selectionLayer.add(marker);
    }

    // Calculate height when the user clicks the scene.
    scene.addEventListener(
      "arcgisViewImmediateClick",
      async (event) => {
        heightText.textContent = "Calculating...";
        details.textContent = "";

        try {
          const hit = await scene.hitTest(event.detail);

          // Find a hit belonging to a 3D point-cloud layer.
          const pointHit = hit.results.find((result) => {
            const layer =
              result.graphic?.layer ?? result.layer;

            return (
              result.mapPoint?.z != null &&
              (
                layer?.type === "point-cloud" ||
                layer?.type === "pointcloud"
              )
            );
          });

          if (!pointHit) {
            heightText.textContent = "No point found";
            details.textContent =
              "Zoom in and click directly on a LiDAR point.";
            return;
          }

          const point = pointHit.mapPoint;
          const pointZ = point.z;

          // Highlight the selected LiDAR point.
          highlightPoint(point);

          // Sample the ground at the SAME horizontal location.
          const groundResult = await view.map.ground
            .queryElevation(point);

          const groundZ = groundResult?.geometry?.z;

          if (!Number.isFinite(groundZ)) {
            heightText.textContent = "No ground elevation";
            details.textContent =
              "Check your DTM and its coverage.";
            return;
          }

          // Calculate height above ground.
          const height = pointZ - groundZ;

          heightText.textContent =
            `${height.toFixed(2)} m`;

          details.textContent =
            `Point elevation: ${pointZ.toFixed(2)} m\n` +
            `Ground elevation: ${groundZ.toFixed(2)} m`;

        } catch (error) {
          console.error("LiDAR calculation error:", error);

          heightText.textContent = "Error";
          details.textContent =
            "Could not calculate height. Check the browser console.";
        }
      }
    );

    // Move the camera to 1.9 m above the terrain at its current X/Y.
    eyeButton.addEventListener("click", async () => {
      eyeButton.disabled = true;
      eyeButton.textContent = "Setting eye level...";

      try {
        const camera = view.camera.clone();
        const position = camera.position.clone();

        const groundResult = await view.map.ground
          .queryElevation(position);

        const groundZ = groundResult?.geometry?.z;

        if (!Number.isFinite(groundZ)) {
          alert("Could not obtain ground elevation at the camera location.");
          return;
        }

        position.z = groundZ + 1.9;
        camera.position = position;

        await view.goTo(camera, {
          animate: true,
          duration: 1000
        });

      } catch (error) {
        console.error("Camera height error:", error);
        alert("Unable to set camera height.");
      } finally {
        eyeButton.disabled = false;
        eyeButton.textContent = "Set eye level (1.9 m)";
      }
    });

    // Remove the marker and reset the results.
    clearButton.addEventListener("click", () => {
      selectionLayer.removeAll();
      heightText.textContent = "Ready";
      details.textContent = "Click a LiDAR point to begin.";
    });
  </script>

</body>
</html>
