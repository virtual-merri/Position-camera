
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiDAR Height Inspector</title>

  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/light/main.css" />
  <script type="module" src="https://js.arcgis.com/5.1/"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    arcgis-scene {
      display: block;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: absolute;
      z-index: 10;
      background: white;
      color: #222;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 3px 14px #0003;
    }

    #result-panel {
      left: 16px;
      bottom: 20px;
      width: 270px;
      max-width: calc(100vw - 64px);
    }

    #controls-panel {
      top: 16px;
      right: 16px;
      width: 220px;
    }

    .heading {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #height {
      font-size: 32px;
      font-weight: bold;
      color: #087f8c;
      margin: 8px 0;
    }

    #details {
      font-size: 12px;
      line-height: 1.6;
      color: #555;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 11px;
      margin-top: 8px;
      border: none;
      border-radius: 6px;
      background: #087f8c;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #06636d;
    }

    button.secondary {
      background: #505d6b;
    }

    button.secondary:hover {
      background: #36414c;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      color: #666;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
    }

    @media (max-width: 500px) {
      #controls-panel {
        top: 10px;
        right: 10px;
        width: 185px;
      }

      #result-panel {
        left: 10px;
        bottom: 10px;
        width: 210px;
      }
    }
  </style>
</head>

<body>

  <arcgis-scene
    id="scene"
    item-id="c71ad5b695274ab2b74b06e705f3ea57">
  </arcgis-scene>

  <div class="panel" id="controls-panel">
    <div class="heading">3D Tools</div>

    <button id="eye-level-button">
      Set eye level (1.8 m)
    </button>

    <button id="zoom-button" class="secondary" disabled>
      Zoom to selected point
    </button>

    <button id="clear-button" class="secondary">
      Clear selected point
    </button>

    <button id="basemap-button" class="secondary">
      Switch to grey basemap
    </button>

    <div class="hint">
      Click a LiDAR point to select and measure its
      height above ground. Zoom in for more precise selection.
    </div>
  </div>

  <div class="panel" id="result-panel">
    <div class="heading">LiDAR Height Inspector</div>

    <div>Height above ground</div>

    <div id="height">Ready</div>

    <div id="details">
      Click a LiDAR point to begin.
    </div>
  </div>

  <script type="module">
    const scene = document.querySelector("#scene");
    const heightText = document.querySelector("#height");
    const details = document.querySelector("#details");

    const eyeButton = document.querySelector("#eye-level-button");
    const zoomButton = document.querySelector("#zoom-button");
    const clearButton = document.querySelector("#clear-button");
    const basemapButton = document.querySelector("#basemap-button");

    let selectedPoint = null;
    let selectionVersion = 0;
    let isGreyBasemap = false;
    let originalBasemap;

    await scene.viewOnReady();

    const view = scene.view;

    const [GraphicsLayer, Graphic] = await $arcgis.import([
      "@arcgis/core/layers/GraphicsLayer.js",
      "@arcgis/core/Graphic.js"
    ]);

    // Preserve the scene's original basemap for restoring it later.
    originalBasemap = view.map.basemap;

    // Dedicated layer for the selected LiDAR point marker.
    const selectionLayer = new GraphicsLayer({
      title: "Selected LiDAR Point",
      elevationInfo: {
        mode: "absolute-height"
      },
      listMode: "hide"
    });

    view.map.add(selectionLayer);

    // Find the point-cloud layers in the existing web scene.
    function getPointCloudLayers() {
      return view.map.allLayers
        .toArray()
        .filter(layer => layer.type === "point-cloud");
    }

    function highlightPoint(point) {
      selectionLayer.removeAll();

      const markerPoint = point.clone();
      markerPoint.z = point.z + 0.15;

      selectionLayer.add(new Graphic({
        geometry: markerPoint,
        symbol: {
          type: "simple-marker",
          style: "circle",
          color: [0, 255, 255, 1],
          size: 17,
          outline: {
            color: [255, 255, 255, 1],
            width: 2
          }
        }
      }));
    }

    // Select a location on the LiDAR point cloud.
    scene.addEventListener(
      "arcgisViewImmediateClick",
      async (event) => {
        const thisSelection = ++selectionVersion;

        heightText.textContent = "Calculating...";
        details.textContent = "";

        try {
          const pointCloudLayers = getPointCloudLayers();

          if (pointCloudLayers.length === 0) {
            heightText.textContent = "No point cloud";
            details.textContent =
              "No PointCloudLayer was found in this scene. " +
              "Check the layer type and visibility.";
            return;
          }

          // Restrict the native ArcGIS hit test to LiDAR layers.
          // This avoids selecting the ground or unrelated layers.
          const hit = await scene.hitTest(
            event.detail,
            { include: pointCloudLayers }
          );

          if (thisSelection !== selectionVersion) return;

          const pointHit = hit.results.find(result => {
            const layer = result.graphic?.layer ?? result.layer;

            return (
              result.mapPoint?.z != null &&
              layer?.type === "point-cloud"
            );
          });

          if (!pointHit) {
            heightText.textContent = "No point found";
            details.textContent =
              "Zoom in and click directly on a visible LiDAR point.";
            return;
          }

          const point = pointHit.mapPoint.clone();

          selectedPoint = point.clone();
          zoomButton.disabled = false;

          highlightPoint(point);

          // Query the ground elevation directly below the point.
          const groundResult = await view.map.ground
            .queryElevation(point);

          if (thisSelection !== selectionVersion) return;

          const groundZ = groundResult?.geometry?.z;

          if (!Number.isFinite(groundZ)) {
            heightText.textContent = "No ground elevation";
            details.textContent =
              "Check the DTM and its coverage.";
            return;
          }

          const height = point.z - groundZ;

          heightText.textContent = `${height.toFixed(2)} m`;

          details.textContent =
            `Point elevation: ${point.z.toFixed(2)} m\n` +
            `Ground elevation: ${groundZ.toFixed(2)} m`;

        } catch (error) {
          console.error("LiDAR calculation error:", error);

          if (thisSelection !== selectionVersion) return;

          heightText.textContent = "Error";
          details.textContent =
            "Could not calculate height. Check the browser console.";
        }
      }
    );

    // Set camera height to 1.8 m above ground at the current X/Y.
    eyeButton.addEventListener("click", async () => {
      eyeButton.disabled = true;
      eyeButton.textContent = "Setting eye level...";

      try {
        const camera = view.camera.clone();
        const position = camera.position.clone();

        const groundResult = await view.map.ground
          .queryElevation(position);

        const groundZ = groundResult?.geometry?.z;

        if (!Number.isFinite(groundZ)) {
          alert("Could not obtain ground elevation at this location.");
          return;
        }

        position.z = groundZ + 1.8;
        camera.position = position;

        await view.goTo(camera, {
          animate: true,
          duration: 1000
        });

      } catch (error) {
        console.error("Camera height error:", error);
        alert("Unable to set camera height.");
      } finally {
        eyeButton.disabled = false;
        eyeButton.textContent = "Set eye level (1.8 m)";
      }
    });

    // Zoom towards the selected LiDAR point.
    zoomButton.addEventListener("click", async () => {
      if (!selectedPoint) return;

      zoomButton.disabled = true;
      zoomButton.textContent = "Zooming...";

      try {
        const point = selectedPoint.clone();

        await view.goTo({
          target: point,
          heading: view.camera.heading,
          tilt: 65,
          range: 20
        }, {
          animate: true,
          duration: 1200
        });

      } catch (error) {
        console.error("Zoom error:", error);
      } finally {
        zoomButton.disabled = !selectedPoint;
        zoomButton.textContent = "Zoom to selected point";
      }
    });

    // Clear the selected point and its marker.
    clearButton.addEventListener("click", () => {
      selectionVersion++;
      selectedPoint = null;

      selectionLayer.removeAll();

      heightText.textContent = "Ready";
      details.textContent = "Click a LiDAR point to begin.";

      zoomButton.disabled = true;
    });

    // Toggle between the original basemap and a 3D grey basemap.
    basemapButton.addEventListener("click", async () => {
      basemapButton.disabled = true;

      try {
        if (!isGreyBasemap) {
          view.map.basemap = "gray-3d";
          isGreyBasemap = true;
          basemapButton.textContent = "Switch to aerial basemap";
        } else {
          view.map.basemap = originalBasemap;
          isGreyBasemap = false;
          basemapButton.textContent = "Switch to grey basemap";
        }

        await view.map.basemap.load();

      } catch (error) {
        console.error("Basemap switch error:", error);
        alert("Unable to switch basemap. Check the browser console.");
      } finally {
        basemapButton.disabled = false;
      }
    });

  </script>
</body>
</html>
